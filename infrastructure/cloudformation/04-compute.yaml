AWSTemplateFormatVersion: "2010-09-09"
Description: "PopViewers production compute layer with ALB, ASG, private EC2, Nginx, Gunicorn, SSM, and backend env config"

Parameters:
  ProjectName:
    Type: String
    Default: popviewers

  EnvironmentName:
    Type: String
    Default: prod

  InstanceType:
    Type: String
    Default: t3.medium

  DesiredCapacity:
    Type: Number
    Default: 1

  MinSize:
    Type: Number
    Default: 1

  MaxSize:
    Type: Number
    Default: 2

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-backend-tg"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-VpcId"
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-AlbSecurityGroupId"
      Subnets:
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-PublicSubnet1Id"
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-PublicSubnet2Id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-alb"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref ApiCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${EnvironmentName}-backend-lt"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name:
            Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-BackendInstanceProfileName"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-BackendSecurityGroupId"
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eux

            dnf update -y
            dnf install -y nginx git python3 python3-pip python3-devel gcc postgresql15-devel amazon-cloudwatch-agent awscli

            mkdir -p /opt/popviewers/releases
            chown -R ec2-user:ec2-user /opt/popviewers

            cat > /opt/popviewers/deploy.env <<'EOF'
            ARTIFACT_BUCKET=popviewers-prod-deployments-003107248390
            AWS_REGION=us-east-1
            ENVIRONMENT=prod
            PROJECT_NAME=popviewers
            EOF

            chown ec2-user:ec2-user /opt/popviewers/deploy.env
            chmod 600 /opt/popviewers/deploy.env

            mkdir -p /etc/popviewers

            DB_SECRET_ARN="arn:aws:secretsmanager:us-east-1:003107248390:secret:popviewers/prod/database-ORk3MD"
            DB_ENDPOINT="popviewers-prod-postgres.ccrgaw60cc8x.us-east-1.rds.amazonaws.com"
            DB_NAME="popviewers"

            DB_SECRET_JSON=$(aws secretsmanager get-secret-value \
              --region us-east-1 \
              --secret-id "$DB_SECRET_ARN" \
              --query SecretString \
              --output text)

            DB_USERNAME=$(DB_SECRET_JSON="$DB_SECRET_JSON" python3 -c "import json, os; print(json.loads(os.environ['DB_SECRET_JSON'])['username'])")
            DB_PASSWORD=$(DB_SECRET_JSON="$DB_SECRET_JSON" python3 -c "import json, os; print(json.loads(os.environ['DB_SECRET_JSON'])['password'])")

            cat > /etc/popviewers/backend.env <<EOF
            DATABASE_URL=postgresql+psycopg2://${!DB_USERNAME}:${!DB_PASSWORD}@${!DB_ENDPOINT}:5432/${!DB_NAME}
            EOF

            chown root:root /etc/popviewers/backend.env
            chmod 600 /etc/popviewers/backend.env

            python3 -m venv /opt/popviewers/venv
            /opt/popviewers/venv/bin/pip install --upgrade pip
            /opt/popviewers/venv/bin/pip install gunicorn uvicorn

            cat > /etc/systemd/system/popviewers-backend.service <<'EOF'
            [Unit]
            Description=PopViewers FastAPI Backend
            After=network.target

            [Service]
            User=ec2-user
            Group=ec2-user
            WorkingDirectory=/opt/popviewers/current
            Environment="PATH=/opt/popviewers/venv/bin"
            EnvironmentFile=/etc/popviewers/backend.env
            ExecStart=/opt/popviewers/venv/bin/gunicorn app.main:app \
              -k uvicorn.workers.UvicornWorker \
              --bind 127.0.0.1:8000 \
              --workers 2 \
              --timeout 120

            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            cat > /etc/nginx/conf.d/popviewers-backend.conf <<'EOF'
            server {
                listen 80;
                server_name _;

                location /health {
                    access_log off;
                    return 200 "ok\n";
                    add_header Content-Type text/plain;
                }

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            rm -f /etc/nginx/conf.d/default.conf || true

            systemctl daemon-reload
            systemctl enable popviewers-backend
            systemctl enable nginx
            systemctl restart nginx

            echo "PopViewers backend server ready for deployment" > /opt/popviewers/README.txt

  BackendAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-${EnvironmentName}-backend-asg"
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-PrivateSubnet1Id"
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-PrivateSubnet2Id"
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs:
        - !Ref BackendTargetGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref BackendLaunchTemplate
        Version: !GetAtt BackendLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-backend"
          PropagateAtLaunch: true

Outputs:
  LoadBalancerDnsName:
    Description: Public DNS name of the application load balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-LoadBalancerDnsName"

  LoadBalancerArn:
    Description: Application Load Balancer ARN
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-LoadBalancerArn"

  BackendTargetGroupArn:
    Description: Backend target group ARN
    Value: !Ref BackendTargetGroup
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-BackendTargetGroupArn"