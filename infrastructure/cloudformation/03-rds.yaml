AWSTemplateFormatVersion: "2010-09-09"
Description: "PopViewers production RDS PostgreSQL database"

Parameters:
  ProjectName:
    Type: String
    Default: popviewers

  EnvironmentName:
    Type: String
    Default: prod

  DatabaseName:
    Type: String
    Default: popviewers

  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.small

  DatabaseAllocatedStorage:
    Type: Number
    Default: 20

  DatabaseBackupRetentionDays:
    Type: Number
    Default: 7

  DatabaseDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

Resources:
  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/${EnvironmentName}/database"
      Description: !Sub "Database credentials for ${ProjectName}-${EnvironmentName}"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"popviewers_admin"}'
        GenerateStringKey: "password"
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName}-${EnvironmentName} private database subnet group"
      SubnetIds:
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-PrivateSubnet1Id"
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-PrivateSubnet2Id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-db-subnet-group"

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${EnvironmentName}-postgres"
      DBName: !Ref DatabaseName
      Engine: postgres
      EngineVersion: "17.8"
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionDays
      DeletionProtection: !Ref DatabaseDeletionProtection
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-${EnvironmentName}-DatabaseSecurityGroupId"
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:password}}"
      EnableCloudwatchLogsExports:
        - postgresql
        - upgrade
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-postgres"

Outputs:
  DatabaseEndpoint:
    Description: RDS PostgreSQL endpoint
    Value: !GetAtt DatabaseInstance.Endpoint.Address
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-DatabaseEndpoint"

  DatabasePort:
    Description: RDS PostgreSQL port
    Value: !GetAtt DatabaseInstance.Endpoint.Port
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-DatabasePort"

  DatabaseName:
    Description: Database name
    Value: !Ref DatabaseName
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-DatabaseName"

  DatabaseSecretArn:
    Description: Secrets Manager ARN for database credentials
    Value: !Ref DatabaseCredentialsSecret
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-DatabaseSecretArn"